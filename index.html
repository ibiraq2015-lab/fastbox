<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفوف الكتب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1310; --surface:#261c15; --surface2:#2f2318; --wood:#4a3222; --wood2:#6b4a30;
  --gold:#cda552; --cream:#efe4d2; --muted:#b6a68c; --line:#4a3728;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f3ead9; --surface:#fffbf3; --surface2:#f6ecda; --cream:#2b2015; --muted:#7a6a52; --line:#ddccae; }
}
:root[data-theme="light"]{ --bg:#f3ead9; --surface:#fffbf3; --surface2:#f6ecda; --cream:#2b2015; --muted:#7a6a52; --line:#ddccae; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'Tajawal',Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding:28px 24px 18px;}
.brand h1{font-family:'Aref Ruqaa',serif;font-size:clamp(30px,5vw,44px);color:var(--gold);margin:0;}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px;}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
#searchInput{background:var(--surface);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:10px 14px;font-family:inherit;font-size:14px;min-width:200px;}
#searchInput:focus{outline:2px solid var(--gold);}
button{font-family:inherit;cursor:pointer;}
#adminBtn,#loginBtn,#logoutBtn{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:10px 16px;font-size:14px;}
#loginBtn,#logoutBtn{border-color:var(--line);color:var(--cream);}
#adminBtn:hover{background:var(--gold);color:var(--bg);}
.demo-badge{background:var(--surface2);color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:7px 14px;font-size:12px;}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 20px;}
.tab{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:8px 16px;font-size:14px;}
.tab.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700;}
main{padding:0 10px 20px;}
.shelf-title{font-family:'Aref Ruqaa',serif;color:var(--gold);font-size:22px;margin:22px 18px 14px;}
.shelf-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px;margin:0 14px 34px;padding:20px 14px 22px;
  border-bottom:12px solid var(--wood);border-radius:3px;box-shadow:0 8px 14px -8px rgba(0,0,0,.6);}
.book{width:118px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:transform .15s ease;border:none;background:none;padding:0;}
.book:hover,.book:focus-visible{transform:translateY(-6px);}
.book .cover{width:100%;aspect-ratio:2/3;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  box-shadow:1px 3px 8px rgba(0,0,0,.45);border-top:4px solid rgba(255,255,255,.3);}
.book .cover img{width:100%;height:100%;object-fit:cover;display:block;}
.book .cover-ph{font-size:30px;opacity:.65;}
.book .t{font-family:'Aref Ruqaa',serif;font-size:14px;font-weight:700;line-height:1.3;margin-top:8px;color:var(--cream);}
.book .a{font-size:11px;color:var(--muted);margin-top:4px;}
.empty{color:var(--muted);padding:30px 24px;line-height:1.8;}
#adminPanel{background:var(--surface);margin:10px 24px 30px;padding:20px;border-radius:12px;border:1px solid var(--line);}
#adminPanel h3{font-family:'Aref Ruqaa',serif;color:var(--gold);margin:22px 0 12px;font-size:19px;}
#adminPanel h3:first-child{margin-top:0;}
.ol-form{display:flex;gap:8px;margin-bottom:10px;}
.ol-form input{flex:1;}
#olResults{max-height:340px;overflow-y:auto;margin-bottom:6px;}
.ol-result{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);}
.ol-result img{width:36px;height:54px;object-fit:cover;border-radius:3px;background:var(--surface2);flex-shrink:0;}
.ol-result .info{flex:1;font-size:13px;line-height:1.5;}
.ol-result select{background:var(--surface2);border:1px solid var(--line);color:var(--cream);border-radius:6px;padding:6px;font-size:12px;}
.ol-result button{background:var(--gold);color:var(--bg);border:none;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;white-space:nowrap;}
.ol-result button:disabled{opacity:.6;}
#addForm{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#addForm input,#addForm select,#addForm textarea,.ol-form input{background:var(--surface2);border:1px solid var(--line);color:var(--cream);
  border-radius:8px;padding:9px 12px;font-family:inherit;font-size:14px;width:100%;}
#addForm textarea{grid-column:1/-1;min-height:60px;resize:vertical;}
#addForm button{grid-column:1/-1;background:var(--gold);border:none;color:var(--bg);border-radius:8px;padding:11px;font-weight:700;font-size:15px;}
.admin-row{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px;gap:10px;}
.del-btn{background:transparent;border:1px solid #a35454;color:#d98080;border-radius:6px;padding:5px 12px;font-size:13px;flex-shrink:0;}
.del-btn:hover{background:#a35454;color:#fff;}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
#modal[hidden]{display:none;}
.modal-card{background:var(--surface);border-top:5px solid var(--gold);border-radius:10px;padding:28px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;}
.modal-cover{width:110px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;display:block;margin:0 auto 16px;box-shadow:0 4px 10px rgba(0,0,0,.4);}
.badge{display:inline-block;background:var(--surface2);color:var(--gold);font-size:12px;border-radius:14px;padding:4px 12px;margin-bottom:10px;}
.modal-card h2{font-family:'Aref Ruqaa',serif;margin:0 0 4px;font-size:24px;color:var(--cream);}
.modal-orig{color:var(--muted);font-size:13px;margin:0 0 10px;}
.modal-author{color:var(--muted);margin:0 0 2px;}
.modal-year{color:var(--muted);margin:0 0 14px;font-size:13px;}
.modal-card p:last-of-type{line-height:1.8;}
#translateBtn{display:block;background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:8px 16px;font-size:13px;margin-top:10px;}
#modalClose{margin-top:16px;background:transparent;border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:9px 20px;}
footer{text-align:center;color:var(--muted);padding:26px;font-size:13px;border-top:1px solid var(--line);margin-top:10px;}
@media(max-width:560px){#addForm{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>رفوف الكتب</h1>
    <p>مكتبة تجلب كتب العالم وتترجمها إلى العربية</p>
  </div>
  <div class="controls">
    <input id="searchInput" type="text" placeholder="ابحث عن كتاب أو مؤلف...">
    <button id="loginBtn">تسجيل الدخول</button>
    <button id="adminBtn" hidden>لوحة الإدارة</button>
    <button id="logoutBtn" hidden>تسجيل الخروج</button>
    <span id="demoNote" class="demo-badge" hidden>وضع تجريبي — أضف إعدادات Firebase لتفعيل الموقع الكامل</span>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-cat="all">الكل</button>
  <button class="tab" data-cat="ar">أدب عربي</button>
  <button class="tab" data-cat="poetry">شعر</button>
  <button class="tab" data-cat="heritage">تراث وتاريخ</button>
  <button class="tab" data-cat="world">أدب عالمي</button>
  <button class="tab" data-cat="sci">علوم وفلسفة</button>
</nav>

<main id="shelves"></main>

<div id="adminPanel" hidden>
  <h3>استيراد كتاب من مكتبة العالم (Open Library)</h3>
  <form id="olSearchForm" class="ol-form">
    <input id="olQuery" dir="ltr" placeholder="اكتب اسم الكتاب أو المؤلف بالإنجليزية...">
    <button type="submit">بحث</button>
  </form>
  <div id="olResults"></div>

  <h3>إضافة كتاب يدوياً</h3>
  <form id="addForm">
    <input name="t" placeholder="العنوان" required>
    <input name="a" placeholder="المؤلف" required>
    <input name="y" placeholder="سنة النشر">
    <select name="c">
      <option value="ar">أدب عربي</option>
      <option value="poetry">شعر</option>
      <option value="heritage">تراث وتاريخ</option>
      <option value="world" selected>أدب عالمي</option>
      <option value="sci">علوم وفلسفة</option>
    </select>
    <textarea name="d" placeholder="وصف مختصر (اختياري)"></textarea>
    <button type="submit">أضف الكتاب</button>
  </form>

  <h3>إدارة الكتب الحالية</h3>
  <div id="adminList"></div>
</div>

<div id="modal" hidden>
  <div class="modal-card">
    <img id="mCover" class="modal-cover">
    <span id="mCat" class="badge"></span>
    <h2 id="mTitle"></h2>
    <p id="mTitleOrig" class="modal-orig"></p>
    <p id="mAuthor" class="modal-author"></p>
    <p id="mYear" class="modal-year"></p>
    <p id="mDesc"></p>
    <button id="translateBtn" hidden>ترجمة الوصف إلى العربية</button>
    <button id="modalClose">إغلاق</button>
  </div>
</div>

<footer>صنع بواسطة ابراهيم مصطفى الراوي</footer>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js';
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js';

/* ============================================================
   إعدادات يجب تعديلها قبل الاستخدام الفعلي
   ============================================================ */
// انسخ إعدادات مشروعك من Firebase Console (يمكن استخدام نفس مشروع Fast Box بمجموعة books منفصلة، أو مشروع جديد)
const firebaseConfig = {
  apiKey: "ضع_apiKey_هنا",
  authDomain: "ضع_authDomain_هنا",
  projectId: "ضع_projectId_هنا",
  storageBucket: "ضع_storageBucket_هنا",
  messagingSenderId: "ضع_messagingSenderId_هنا",
  appId: "ضع_appId_هنا"
};
// البريد الإلكتروني الذي سيحصل على صلاحيات الإدارة بعد تسجيل الدخول بحساب Google
const ADMIN_EMAIL = "your-email@gmail.com";
// اختياري: مفتاح Gemini API لترجمة أدق وأكثر سلاسة (اتركه فارغاً لاستخدام خدمة ترجمة مجانية بديلة تعمل بدون مفتاح)
const GEMINI_API_KEY = "";
const GEMINI_MODEL = "gemini-2.0-flash";
/* ============================================================ */

const FB_CONFIGURED = !!(firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('ضع_'));
let db=null, auth=null;
if(FB_CONFIGURED){
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);
}

const seedBooks=[
{t:"أولاد حارتنا",a:"نجيب محفوظ",y:"1959",c:"ar",d:"رواية رمزية تعيد سرد مسيرة الأنبياء في حارة قاهرية واحدة."},
{t:"بين القصرين",a:"نجيب محفوظ",y:"1956",c:"ar",d:"الجزء الأول من الثلاثية الشهيرة، حياة أسرة قاهرية عبر الأجيال."},
{t:"رجال في الشمس",a:"غسان كنفاني",y:"1963",c:"ar",d:"مأساة اللجوء الفلسطيني في رحلة بحثاً عن العمل والكرامة."},
{t:"موسم الهجرة إلى الشمال",a:"الطيب صالح",y:"1966",c:"ar",d:"صراع الهوية بين الشرق والغرب في رواية سودانية خالدة."},
{t:"ذاكرة الجسد",a:"أحلام مستغانمي",y:"1993",c:"ar",d:"رواية عن الحب والوطن والذاكرة الجزائرية."},
{t:"الأيام",a:"طه حسين",y:"1926",c:"ar",d:"سيرة ذاتية لعميد الأدب العربي وكفاحه رغم فقدان بصره."},
{t:"ديوان المتنبي",a:"المتنبي",y:"القرن 10",c:"poetry",d:"ديوان أشهر شعراء اللغة العربية على الإطلاق."},
{t:"النبي",a:"جبران خليل جبران",y:"1923",c:"poetry",d:"تأملات شعرية فلسفية عن الحياة والحب والعمل."},
{t:"أنشودة المطر",a:"بدر شاكر السياب",y:"1960",c:"poetry",d:"ديوان علامة فارقة في تاريخ الشعر العربي الحر."},
{t:"ديوان نزار قباني",a:"نزار قباني",y:"شعر",c:"poetry",d:"قصائد شاعر الحب والمرأة الأشهر في الأدب العربي الحديث."},
{t:"ألف ليلة وليلة",a:"مؤلف مجهول",y:"تراث",c:"heritage",d:"حكايات شهرزاد الخالدة، من أعظم كنوز التراث العربي."},
{t:"مقدمة ابن خلدون",a:"ابن خلدون",y:"1377",c:"heritage",d:"أساس علم الاجتماع والعمران البشري في فكر عربي مبكر."},
{t:"الكامل في التاريخ",a:"ابن الأثير",y:"تراث",c:"heritage",d:"موسوعة تاريخية شاملة لأحداث العالم الإسلامي."},
{t:"كليلة ودمنة",a:"ابن المقفع",y:"تراث",c:"heritage",d:"حكم وحكايات على ألسنة الحيوانات، من روائع الأدب العربي القديم."},
{t:"رحلة ابن بطوطة",a:"ابن بطوطة",y:"1355",c:"heritage",d:"أشهر رحلة في التاريخ الإسلامي عبر قارات العالم القديم."},
{t:"دون كيخوته",a:"ميغيل دي ثيربانتس",y:"1605",c:"world",d:"يُعد أول رواية حديثة في الأدب الغربي، بطلها فارس يحلم بالمثالية."},
{t:"الحرب والسلام",a:"ليو تولستوي",y:"1869",c:"world",d:"ملحمة روسية عن الحرب والحب في زمن الغزو النابليوني."},
{t:"الجريمة والعقاب",a:"فيودور دوستويفسكي",y:"1866",c:"world",d:"رحلة نفسية عميقة في أعماق الذنب والضمير الإنساني."},
{t:"مئة عام من العزلة",a:"غابرييل غارسيا ماركيز",y:"1967",c:"world",d:"رائعة الواقعية السحرية وقصة عائلة بوينديا عبر الأجيال."},
{t:"1984",a:"جورج أورويل",y:"1949",c:"world",d:"رواية ديستوبية عن المراقبة الشمولية وسلطة الدولة المطلقة."},
{t:"البؤساء",a:"فيكتور هوغو",y:"1862",c:"world",d:"ملحمة إنسانية عن العدالة والفداء في فرنسا القرن التاسع عشر."},
{t:"تاريخ موجز للزمن",a:"ستيفن هوكينغ",y:"1988",c:"sci",d:"رحلة مبسطة في أسرار الكون والزمان والثقوب السوداء."},
{t:"جمهورية أفلاطون",a:"أفلاطون",y:"فلسفة",c:"sci",d:"حوار فلسفي أسس لفكرة العدالة والدولة المثالية."},
{t:"أصل الأنواع",a:"تشارلز داروين",y:"1859",c:"sci",d:"الكتاب الذي أسس نظرية التطور والانتخاب الطبيعي."}
];
const catNames={ar:"أدب عربي",poetry:"شعر",heritage:"تراث وتاريخ",world:"أدب عالمي",sci:"علوم وفلسفة"};
const spineColors=["#8b3a3a","#3d5c4e","#2e4057","#7a5c2e","#5a3d5c"];
let books=[], isAdmin=false, activeCat="all", searchTerm="";

function colorFor(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return spineColors[h%spineColors.length];}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function coverUrl(id,size){return id?`https://covers.openlibrary.org/b/id/${id}-${size||'M'}.jpg`:'';}

async function translateText(text){
  if(!text) return '';
  if(GEMINI_API_KEY){
    try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{role:'user',parts:[{text:'ترجم النص التالي إلى العربية الفصحى بأسلوب أدبي سلس، وأعد نص الترجمة فقط دون أي مقدمات:\n\n'+text}]}]})
      });
      const j=await r.json();
      const out=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts[0].text;
      if(out) return out.trim();
    }catch(e){/* fallback below */}
  }
  try{
    const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0,480))}&langpair=en|ar`);
    const j=await r.json();
    return (j&&j.responseData&&j.responseData.translatedText)||text;
  }catch(e){return text;}
}

async function searchOpenLibrary(q){
  try{
    const r=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&fields=key,title,author_name,cover_i,first_publish_year&limit=12`);
    const j=await r.json();
    return j.docs||[];
  }catch(e){return [];}
}
async function fetchWorkDescription(workKey){
  try{
    const r=await fetch(`https://openlibrary.org${workKey}.json`);
    const j=await r.json();
    if(!j.description) return '';
    return typeof j.description==='string'?j.description:(j.description.value||'');
  }catch(e){return '';}
}

async function loadBooks(){
  if(!db){ books=seedBooks.map((b,i)=>({id:'s'+i,...b})); render(); renderAdminList(); return; }
  try{
    const snap=await getDocs(collection(db,'books'));
    books=snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){ console.error(e); books=[]; }
  render(); renderAdminList();
}

function render(){
  const main=document.getElementById('shelves'); main.innerHTML='';
  if(searchTerm){
    const list=books.filter(b=>((b.t_ar||'')+b.t+b.a).includes(searchTerm));
    if(list.length) main.appendChild(buildRow('نتائج البحث',list));
    else main.innerHTML='<p class="empty">لم يُعثر على نتائج مطابقة.</p>';
    return;
  }
  const cats=activeCat==='all'?Object.keys(catNames):[activeCat];
  let any=false;
  cats.forEach(c=>{
    const items=books.filter(b=>b.c===c);
    if(items.length){any=true; main.appendChild(buildRow(catNames[c],items));}
  });
  if(!any) main.innerHTML='<p class="empty">لا توجد كتب في هذا القسم بعد.'+(isAdmin?' استخدم لوحة الإدارة للاستيراد من مكتبة العالم أو الإضافة يدوياً.':'')+'</p>';
}

function buildRow(label,items){
  const wrap=document.createElement('div');
  const h=document.createElement('h2'); h.className='shelf-title'; h.textContent=label; wrap.appendChild(h);
  const row=document.createElement('div'); row.className='shelf-row';
  items.forEach(b=>{
    const card=document.createElement('button'); card.className='book'; card.type='button';
    const coverInner=b.cover?`<img src="${b.cover}" alt="" loading="lazy">`:'<span class="cover-ph">📖</span>';
    card.innerHTML=`<span class="cover" style="background:${colorFor(b.id)}">${coverInner}</span><span class="t">${esc(b.t_ar||b.t)}</span><span class="a">${esc(b.a)}</span>`;
    card.onclick=()=>openModal(b);
    row.appendChild(card);
  });
  wrap.appendChild(row);
  return wrap;
}

function openModal(b){
  const img=document.getElementById('mCover');
  if(b.cover){img.src=b.cover; img.style.display='block';} else {img.style.display='none';}
  document.getElementById('mCat').textContent=catNames[b.c]||'';
  document.getElementById('mTitle').textContent=b.t_ar||b.t;
  const orig=document.getElementById('mTitleOrig');
  if(b.t_ar && b.t_ar!==b.t){orig.textContent=b.t; orig.style.display='block';} else {orig.style.display='none';}
  document.getElementById('mAuthor').textContent='المؤلف: '+b.a;
  document.getElementById('mYear').textContent=b.y?('سنة النشر: '+b.y):'';
  document.getElementById('mDesc').textContent=b.d_ar||b.d||'لا يوجد وصف متاح لهذا الكتاب.';
  const tBtn=document.getElementById('translateBtn');
  if(b.d && !b.d_ar){
    tBtn.hidden=false; tBtn.disabled=false; tBtn.textContent='ترجمة الوصف إلى العربية';
    tBtn.onclick=async()=>{
      tBtn.disabled=true; tBtn.textContent='جارٍ الترجمة...';
      const d_ar=await translateText(b.d);
      document.getElementById('mDesc').textContent=d_ar; b.d_ar=d_ar;
      if(isAdmin && db){ try{await updateDoc(doc(db,'books',b.id),{d_ar});}catch(e){} }
      tBtn.hidden=true;
    };
  } else { tBtn.hidden=true; }
  document.getElementById('modal').hidden=false;
}
document.getElementById('modalClose').onclick=()=>{document.getElementById('modal').hidden=true;};
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.hidden=true;});

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); activeCat=t.dataset.cat; searchTerm='';
  document.getElementById('searchInput').value=''; render();
});
document.getElementById('searchInput').oninput=e=>{searchTerm=e.target.value.trim(); render();};
document.getElementById('adminBtn').onclick=()=>{
  const p=document.getElementById('adminPanel'); p.hidden=!p.hidden;
};

async function importBook(d,category){
  const desc=await fetchWorkDescription(d.key);
  const t_ar=await translateText(d.title);
  const d_ar=desc?await translateText(desc):'';
  const book={t:d.title,a:(d.author_name||[]).join('، ')||'غير معروف',y:d.first_publish_year?String(d.first_publish_year):'',c:category,d:desc,t_ar,d_ar,cover:coverUrl(d.cover_i,'M')};
  if(db){ await addDoc(collection(db,'books'),book); await loadBooks(); }
  else { book.id='s'+Date.now(); books.push(book); render(); renderAdminList(); }
}

document.getElementById('olSearchForm').onsubmit=async e=>{
  e.preventDefault();
  const q=document.getElementById('olQuery').value.trim(); if(!q) return;
  const results=document.getElementById('olResults'); results.innerHTML='<p class="empty">جارٍ البحث...</p>';
  const docs=await searchOpenLibrary(q);
  results.innerHTML='';
  docs.forEach(d=>{
    const row=document.createElement('div'); row.className='ol-result';
    const img=document.createElement('img'); img.src=coverUrl(d.cover_i,'S')||''; img.alt=''; row.appendChild(img);
    const info=document.createElement('div'); info.className='info';
    info.innerHTML='<b>'+esc(d.title)+'</b><br>'+esc((d.author_name||[]).join('، '))+(d.first_publish_year?' · '+esc(String(d.first_publish_year)):'');
    row.appendChild(info);
    const sel=document.createElement('select');
    Object.entries(catNames).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;if(k==='world')o.selected=true;sel.appendChild(o);});
    row.appendChild(sel);
    const btn=document.createElement('button'); btn.textContent='استيراد وترجمة';
    btn.onclick=async()=>{
      btn.disabled=true; btn.textContent='جارٍ الاستيراد...';
      try{ await importBook(d,sel.value); btn.textContent='تمت الإضافة ✓'; }
      catch(err){ btn.textContent='فشل، حاول مجدداً'; btn.disabled=false; }
    };
    row.appendChild(btn);
    results.appendChild(row);
  });
  if(!docs.length) results.innerHTML='<p class="empty">لا توجد نتائج مطابقة.</p>';
};

document.getElementById('addForm').onsubmit=async e=>{
  e.preventDefault();
  const f=e.target;
  const nb={t:f.t.value.trim(),a:f.a.value.trim(),y:f.y.value.trim(),c:f.c.value,d:f.d.value.trim(),t_ar:'',d_ar:''};
  if(!nb.t||!nb.a) return;
  if(db){ try{await addDoc(collection(db,'books'),nb); await loadBooks();}catch(err){alert('تعذّرت إضافة الكتاب — تحقق من صلاحياتك.');} }
  else { nb.id='s'+Date.now(); books.push(nb); render(); renderAdminList(); }
  f.reset();
};

async function deleteBook(b){
  if(db){ try{await deleteDoc(doc(db,'books',b.id)); await loadBooks();}catch(err){alert('تعذّر حذف الكتاب — تحقق من صلاحياتك.');} }
  else { books=books.filter(x=>x.id!==b.id); render(); renderAdminList(); }
}
function renderAdminList(){
  const list=document.getElementById('adminList'); list.innerHTML='';
  books.forEach(b=>{
    const row=document.createElement('div'); row.className='admin-row';
    const span=document.createElement('span'); span.textContent=(b.t_ar||b.t)+' — '+b.a; row.appendChild(span);
    const btn=document.createElement('button'); btn.textContent='حذف'; btn.className='del-btn';
    btn.onclick=()=>deleteBook(b);
    row.appendChild(btn); list.appendChild(row);
  });
}

if(FB_CONFIGURED){
  onAuthStateChanged(auth,u=>{
    isAdmin=!!u && u.email===ADMIN_EMAIL;
    document.getElementById('loginBtn').hidden=!!u;
    document.getElementById('adminBtn').hidden=!isAdmin;
    document.getElementById('logoutBtn').hidden=!u;
    if(!isAdmin) document.getElementById('adminPanel').hidden=true;
    loadBooks();
  });
  document.getElementById('loginBtn').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>alert('فشل تسجيل الدخول.'));
  document.getElementById('logoutBtn').onclick=()=>signOut(auth);
} else {
  isAdmin=true;
  document.getElementById('loginBtn').hidden=true;
  document.getElementById('adminBtn').hidden=false;
  document.getElementById('demoNote').hidden=false;
  loadBooks();
}
</script>
</body>
</html>
